# One-command local Minecraft server for the bots to build in.
#   npm run server        # start it (docker compose up -d)
#   npm run server:logs   # watch until you see "Done!"
#   npm run server:stop   # stop it
#
# Pinned to 1.20.1 (the version the bots target - exactly supported by the browser viewer) with online-mode off so the
# bots can log in without paid accounts. This server is local-only - do not
# expose port 25565 to the internet.
services:
  minecraft:
    image: itzg/minecraft-server:java21
    container_name: minecraft-agentic
    ports:
      # Loopback only - offline-mode + opped bot names means anyone who can reach this port
      # joins as an operator, and Docker-published ports bypass host firewalls.
      - "127.0.0.1:25565:25565"
    environment:
      EULA: "TRUE"
      ONLINE_MODE: "FALSE"
      ENABLE_COMMAND_BLOCK: "TRUE"
      VERSION: "1.20.1"
      MEMORY: "1G"
      # Raised superflat: solid rock from bedrock to a grass surface at y=63. Flat on purpose -
      # normal terrain generates caverns under every plot and nothing here goes underground.
      # Do NOT use a default superflat (no GENERATOR_SETTINGS): its surface sits at y=-60 and
      # prismarine-viewer never meshes sections below y=0, so it renders as empty sky.
      # Must match scripts/server.js. Takes effect only at world CREATION.
      LEVEL_TYPE: "FLAT"
      GENERATOR_SETTINGS: '{"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:deepslate","height":63},{"block":"minecraft:stone","height":61},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}'
    volumes:
      - mc-data:/data
      # CRITICAL: the bots build with /setblock, /fill and /tp, which require operator
      # permission. We mount a prebuilt ops.json listing every default bot username with
      # its OFFLINE uuid (online-mode is off, so the usual `OPS` env - which does an online
      # PlayerDB lookup - fails). If you use a custom MC_USERNAME, regenerate this file:
      #   npm run ops    (writes docker/ops.json)
      - ./docker/ops.json:/data/ops.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc-health"]
      start_period: 90s
      interval: 5s
      retries: 20

volumes:
  mc-data:
